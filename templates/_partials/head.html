<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
<title>{{seoTitle}}</title>
<meta name="description" content="{{seoDescription}}">
<link rel="canonical" href="{{canonical}}">

<!-- Open Graph -->
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{seoTitle}}">
<meta property="og:description" content="{{seoDescription}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="Al Bari Travel & Tours">
<meta property="og:image" content="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1200&h=630&fit=crop">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{seoTitle}}">
<meta name="twitter:description" content="{{seoDescription}}">
<meta name="twitter:image" content="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1200&h=630&fit=crop">

<!-- Favicon + iOS -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="theme-color" content="#0d1b2a">

<!-- Perf: connect to font origins early (saves ~100-300ms) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
