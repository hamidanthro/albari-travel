<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
<title>{{seoTitle}}</title>
<meta name="description" content="{{seoDescription}}">
<link rel="canonical" href="{{canonical}}">

<!-- hreflang: this site exists in English + Urdu -->
<link rel="alternate" hreflang="en" href="https://www.albaritravelspk.com{{hreflangEnUrl}}">
<link rel="alternate" hreflang="ur" href="https://www.albaritravelspk.com{{hreflangUrUrl}}">
<link rel="alternate" hreflang="x-default" href="https://www.albaritravelspk.com{{hreflangEnUrl}}">

<!-- Open Graph -->
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{seoTitle}}">
<meta property="og:description" content="{{seoDescription}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="Al Bari Travel & Tours">
<meta property="og:image" content="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1200&h=630&fit=crop">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Al Bari Travel & Tours — Umrah, Hajj, and international flight booking from Pakistan and the USA">
<meta property="og:locale" content="en_US">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{seoTitle}}">
<meta name="twitter:description" content="{{seoDescription}}">
<meta name="twitter:image" content="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1200&h=630&fit=crop">

<!-- Favicon + iOS + PWA -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Perf: preconnect + preload critical resources for LCP -->
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preload" as="image" href="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1600" fetchpriority="high">
<link rel="preload" as="font" type="font/woff2" href="/fonts/inter-variable.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-display-variable.woff2" crossorigin>

<!-- Self-hosted fonts (replaces Google Fonts external request) -->
<link rel="stylesheet" href="/fonts/fonts.css?v=20260625a">
<link rel="stylesheet" href="/css/main.min.css?v=20260625a">

<!-- Site search + exit intent + cost calc — all deferred -->
<script src="/js/site-search.js?v=20260625a" defer></script>
<script src="/js/exit-intent.js?v=20260625a" defer></script>
<script src="/js/cost-calculator.js?v=20260625a" defer></script>
