<!DOCTYPE html>
<html lang="en">
<head>
{{>head}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.albaritravelspk.com/" },
    { "@type": "ListItem", "position": 2, "name": "Our Offices", "item": "https://www.albaritravelspk.com/offices/" }
  ]
}
</script>
</head>
<body>
{{>header}}

<section class="hero" style="min-height:auto;padding:140px 40px 60px;">
    <div class="hero-content" style="text-align:center;">
        <p class="hero-tag">Our Locations</p>
        <h1 style="font-size:3rem;">Our Offices</h1>
        <p style="opacity:0.85;margin-top:14px;max-width:640px;margin-left:auto;margin-right:auto;">Two offices, one team. Reach us in Pakistan or in the United States — tap a card to see full details for that office.</p>
    </div>
</section>

<section class="packages" id="offices">
    <div class="offices-grid">
{{{officeCards}}}
    </div>
</section>

{{>footer}}
</body>
</html>
