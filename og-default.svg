<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2a3f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a962"/>
      <stop offset="100%" stop-color="#e8c97e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- decorative airplane silhouette in the corner -->
  <g transform="translate(900,80) rotate(15)" opacity="0.08" fill="#c9a962">
    <path d="M0,40 L80,0 L300,0 L260,40 L600,40 L580,60 L260,60 L300,100 L80,100 Z"/>
  </g>
  <!-- gold corner accent -->
  <rect x="80" y="80" width="80" height="3" fill="url(#gold)"/>
  <!-- text -->
  <text x="80" y="150" font-family="'Inter', sans-serif" font-size="22" font-weight="600" letter-spacing="6" fill="#c9a962">YOUR TRUSTED TRAVEL PARTNER</text>
  <text x="80" y="270" font-family="'Playfair Display', Georgia, serif" font-size="78" font-weight="700" fill="#fff">Al Bari Travel</text>
  <text x="80" y="360" font-family="'Playfair Display', Georgia, serif" font-size="78" font-weight="700" fill="url(#gold)">&amp; Tours</text>
  <text x="80" y="450" font-family="'Inter', sans-serif" font-size="30" font-weight="400" fill="rgba(255,255,255,0.85)">Umrah · Hajj · International Flights</text>
  <text x="80" y="500" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.6)">7 walk-in offices · Pakistan &amp; USA</text>
  <!-- bottom accent -->
  <rect x="0" y="615" width="1200" height="15" fill="url(#gold)"/>
  <text x="1120" y="585" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="end">albaritravelspk.com</text>
</svg>
